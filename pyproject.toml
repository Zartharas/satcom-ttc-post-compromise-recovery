[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satcom-ttc-post-compromise-recovery"
version = "0.1.1"
description = "Deterministic research simulator for SATCOM TT&C post-compromise recovery."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Aman Kumar Singh"}]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
