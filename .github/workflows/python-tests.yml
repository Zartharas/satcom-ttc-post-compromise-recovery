name: Python tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate review handoff
        run: |
          if [ -f experiments/scripts/validate_review_handoff.py ]; then
            python experiments/scripts/validate_review_handoff.py
          fi

      - name: Validate provisional T1 design
        run: |
          if [ -f experiments/scripts/validate_t1_provisional_design.py ]; then
            python experiments/scripts/validate_t1_provisional_design.py
          fi

      - name: Validate Phase 07 seeded metrics
        run: |
          if [ -f experiments/scripts/validate_phase07_seeded_metrics.py ]; then
            python experiments/scripts/validate_phase07_seeded_metrics.py
          fi

      - name: Validate Phase 08 provisional analysis
        run: |
          if [ -f experiments/scripts/validate_phase08_provisional_analysis.py ]; then
            python experiments/scripts/validate_phase08_provisional_analysis.py
          fi

      - name: Run Phase 07 export smoke test
        if: matrix.python-version == '3.13'
        env:
          PYTHONPATH: src
        run: |
          if [ -f experiments/scripts/run_seeded_fault_experiments.py ]; then
            python experiments/scripts/run_seeded_fault_experiments.py \
              --json-output /tmp/phase07-results.json \
              --csv-output /tmp/phase07-metrics.csv
            test -s /tmp/phase07-results.json
            test -s /tmp/phase07-metrics.csv
          fi

      - name: Run Phase 08 analysis smoke test
        if: matrix.python-version == '3.13'
        env:
          PYTHONPATH: src
        run: |
          if [ -f experiments/scripts/analyze_phase07_results.py ]; then
            python experiments/scripts/analyze_phase07_results.py \
              --input-json /tmp/phase07-results.json \
              --metrics-csv /tmp/phase07-metrics.csv \
              --output-dir /tmp/phase08-analysis
            test -s /tmp/phase08-analysis/phase08-analysis.json
            test -s /tmp/phase08-analysis/phase08-trace-anomalies.csv
            test -s /tmp/phase08-analysis/phase08-sensitivity-summary.csv
            (
              cd /tmp/phase08-analysis
              sha256sum -c phase08-derived-bundle.sha256
            )
          fi

      - name: Generate expected manifest
        if: matrix.python-version == '3.13'
        run: python experiments/scripts/validate_repository_manifest.py --print > expected-manifest.sha256

      - name: Upload expected manifest
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v5
        with:
          name: expected-manifest
          path: expected-manifest.sha256
          retention-days: 1

      - name: Validate tracked-file manifest
        run: python experiments/scripts/validate_repository_manifest.py
