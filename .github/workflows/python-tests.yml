name: Python and formal-model tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate review handoff
        run: |
          if [ -f experiments/scripts/validate_review_handoff.py ]; then
            python experiments/scripts/validate_review_handoff.py
          fi

      - name: Validate provisional T1 design
        run: |
          if [ -f experiments/scripts/validate_t1_provisional_design.py ]; then
            python experiments/scripts/validate_t1_provisional_design.py
          fi

      - name: Validate Phase 07 seeded metrics
        run: |
          if [ -f experiments/scripts/validate_phase07_seeded_metrics.py ]; then
            python experiments/scripts/validate_phase07_seeded_metrics.py
          fi

      - name: Validate Phase 08 provisional analysis
        run: |
          if [ -f experiments/scripts/validate_phase08_provisional_analysis.py ]; then
            python experiments/scripts/validate_phase08_provisional_analysis.py
          fi

      - name: Validate Phase 09 formal coverage
        env:
          PYTHONPATH: src
        run: |
          if [ -f experiments/scripts/validate_phase09_formal_coverage.py ]; then
            python experiments/scripts/validate_phase09_formal_coverage.py
          fi

      - name: Validate Phase 10 formal execution
        run: |
          if [ -f experiments/scripts/validate_phase10_formal_execution.py ]; then
            python experiments/scripts/validate_phase10_formal_execution.py
          fi

      - name: Validate Phase 11 cross-validation
        run: |
          if [ -f experiments/scripts/validate_phase11_cross_validation.py ]; then
            python experiments/scripts/validate_phase11_cross_validation.py
          fi

      - name: Validate Phase 12 adverse outcomes
        run: |
          if [ -f experiments/scripts/validate_phase12_adverse_outcomes.py ]; then
            python experiments/scripts/validate_phase12_adverse_outcomes.py
          fi

      - name: Validate Phase 13 outcome expansion
        run: |
          if [ -f experiments/scripts/validate_phase13_outcome_expansion.py ]; then
            python experiments/scripts/validate_phase13_outcome_expansion.py
          fi

      - name: Run Phase 07 export smoke test
        if: matrix.python-version == '3.13'
        env:
          PYTHONPATH: src
        run: |
          if [ -f experiments/scripts/run_seeded_fault_experiments.py ]; then
            python experiments/scripts/run_seeded_fault_experiments.py \
              --json-output /tmp/phase07-results.json \
              --csv-output /tmp/phase07-metrics.csv
            test -s /tmp/phase07-results.json
            test -s /tmp/phase07-metrics.csv
          fi

      - name: Run Phase 08 analysis smoke test
        if: matrix.python-version == '3.13'
        env:
          PYTHONPATH: src
        run: |
          if [ -f experiments/scripts/analyze_phase07_results.py ]; then
            python experiments/scripts/analyze_phase07_results.py \
              --input-json /tmp/phase07-results.json \
              --metrics-csv /tmp/phase07-metrics.csv \
              --output-dir /tmp/phase08-analysis
            test -s /tmp/phase08-analysis/phase08-analysis.json
            test -s /tmp/phase08-analysis/phase08-trace-anomalies.csv
            test -s /tmp/phase08-analysis/phase08-sensitivity-summary.csv
            (
              cd /tmp/phase08-analysis
              sha256sum -c phase08-derived-bundle.sha256
            )
          fi

      - name: Run Phase 09 coverage smoke test
        if: matrix.python-version == '3.13'
        env:
          PYTHONPATH: src
        run: |
          if [ -f experiments/scripts/run_phase09_coverage.py ]; then
            python experiments/scripts/run_phase09_coverage.py \
              --output-dir /tmp/phase09-coverage
            test -s /tmp/phase09-coverage/phase09-coverage-reachability.json
            test -s /tmp/phase09-coverage/phase09-reachability.csv
            test -s /tmp/phase09-coverage/phase09-invariant-traceability.csv
            (
              cd /tmp/phase09-coverage
              sha256sum -c phase09-derived-bundle.sha256
            )
          fi

      - name: Generate expected manifest
        if: matrix.python-version == '3.13'
        run: python experiments/scripts/validate_repository_manifest.py --print > expected-manifest.sha256

      - name: Upload expected manifest
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v5
        with:
          name: expected-manifest
          path: expected-manifest.sha256
          retention-days: 1

      - name: Validate tracked-file manifest
        run: python experiments/scripts/validate_repository_manifest.py

  formal:
    name: TLA+ TLC 1.7.4
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download pinned TLA+ tools
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "bee4a54f3ee3d4afc347c3240ec2d9e93b075104  /tmp/tla2tools.jar" | sha1sum -c -

      - name: Validate Phase 10 design
        run: python experiments/scripts/validate_phase10_formal_execution.py

      - name: Run SANY and TLC gates
        env:
          PYTHONPATH: src
        run: |
          python experiments/scripts/run_phase10_formal_execution.py \
            --jar /tmp/tla2tools.jar \
            --output-dir /tmp/phase10-formal

      - name: Verify Phase 10 derived bundle
        run: |
          cd /tmp/phase10-formal
          sha256sum -c phase10-derived-bundle.sha256
          test -s phase10-formal-execution.json
          test -s phase10-negative-control-counterexample.json
          test -s phase10-sany.log
          test -s phase10-tlc-positive.log
          test -s phase10-tlc-negative-control.log

      - name: Upload Phase 10 execution evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase10-formal-execution
          path: /tmp/phase10-formal/phase10-*
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Phase 11 design
        run: python experiments/scripts/validate_phase11_cross_validation.py

      - name: Run Phase 11 trace and bound gates
        env:
          PYTHONPATH: src
        run: |
          python experiments/scripts/run_phase11_cross_validation.py \
            --jar /tmp/tla2tools.jar \
            --output-dir /tmp/phase11-cross-validation

      - name: Verify Phase 11 derived bundle
        run: |
          cd /tmp/phase11-cross-validation
          sha256sum -c phase11-derived-bundle.sha256
          test -s phase11-cross-validation.json
          test -s phase11-success-witness.json
          test -s phase11-trace-comparison.csv
          test -s phase11-bound-expansion.csv
          test -s phase11-tlc-success-witness.log

      - name: Upload Phase 11 cross-validation evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase11-formal-python-cross-validation
          path: /tmp/phase11-cross-validation/phase11-*
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Phase 12 design
        run: python experiments/scripts/validate_phase12_adverse_outcomes.py

      - name: Run Phase 12 adverse witness gates
        env:
          PYTHONPATH: src
        run: |
          python experiments/scripts/run_phase12_adverse_validation.py \
            --jar /tmp/tla2tools.jar \
            --output-dir /tmp/phase12-adverse-validation

      - name: Verify Phase 12 derived bundle
        run: |
          cd /tmp/phase12-adverse-validation
          sha256sum -c phase12-derived-bundle.sha256
          test -s phase12-adverse-outcome-validation.json
          test -s phase12-witness-indeterminate.json
          test -s phase12-witness-secure-degraded.json
          test -s phase12-witness-expired.json
          test -s phase12-unreached-outcomes.csv

      - name: Upload Phase 12 adverse-outcome evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase12-adverse-outcome-validation
          path: /tmp/phase12-adverse-validation/phase12-*
          if-no-files-found: warn
          retention-days: 7

      - name: Validate Phase 13 design
        run: python experiments/scripts/validate_phase13_outcome_expansion.py

      - name: Run Phase 13 baseline and expansion gates
        env:
          PYTHONPATH: src
        run: |
          python experiments/scripts/run_phase13_outcome_expansion.py \
            --jar /tmp/tla2tools.jar \
            --output-dir /tmp/phase13-outcome-expansion

      - name: Verify Phase 13 derived bundle
        run: |
          cd /tmp/phase13-outcome-expansion
          sha256sum -c phase13-derived-bundle.sha256
          test -s phase13-outcome-expansion-validation.json
          test -s phase13-baseline-regression.csv
          test -s phase13-expansion-assignment-audit.csv
          test -s phase13-witness-diverged.json
          test -s phase13-witness-available-unsafe.json
          test -s phase13-witness-locked.json

      - name: Upload Phase 13 outcome-expansion evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: phase13-outcome-expansion-validation
          path: /tmp/phase13-outcome-expansion/phase13-*
          if-no-files-found: warn
          retention-days: 7
