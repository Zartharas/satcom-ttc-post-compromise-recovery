name: TAES generated manuscript and Study B S1 integrity

on:
  pull_request:
    paths:
      - '.github/workflows/taes-s1-publication-hygiene.yml'
      - 'paper/manuscript/**'
      - 'paper/supplement/**'
      - 'references/bibliography.bib'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manuscript-s1:
    name: Preserve frozen results, 250-word abstract, S1 and exact regeneration
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check Python and full Study B supplement
        run: |
          python3 -m py_compile paper/supplement/build_table_s0.py paper/supplement/build_table_s1.py
          python3 paper/supplement/build_table_s0.py --check
          python3 paper/supplement/build_table_s1.py --check
      - name: Rebuild integrated manuscript and require byte-for-byte equality
        run: |
          python3 paper/manuscript/build_integrated_manuscript.py
          git diff --exit-code -- paper/manuscript/manuscript.md
      - name: Check abstract exact word count and forbidden process language
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("paper/manuscript/build_integrated_manuscript.py")
          spec=importlib.util.spec_from_file_location("taes_builder",p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          assert len(m.ABSTRACT.split())==250, len(m.ABSTRACT.split())
          assert m.family_evidence_cue('CF-02', '{"security_state":"SECURE_PROVISIONAL","verification_complete":true}')=='Verification complete'
          assert 'Supplementary Table S0' in Path('paper/manuscript/manuscript.md').read_text(encoding='utf-8')
          source=Path("paper/manuscript/manuscript.md").read_text(encoding="utf-8")
          for phrase in ("The paper should therefore use Study C", "The submission/release step should publish"):
              assert phrase not in source, phrase
          print("TAES_ABSTRACT_250=PASS")
          print("TAES_PROCESS_LEAKAGE_TARGETS=PASS")
          PY
      - name: Validate tracked-file manifest
        run: |
          sha256sum -c artifacts/manifests/repository-v0.1.1.sha256
          echo 'TAES_FROZEN_RESULTS_UNCHANGED=PASS'
          echo 'TAES_REVIEW_READY_PDF=NOT_GENERATED'
          echo 'TAES_PUBLISHER_SUBMISSION=NOT_AUTHORIZED'
