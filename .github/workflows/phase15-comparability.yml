name: Phase 15 treatment comparability

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase15-comparability-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate WP15-D2 through WP15-D4R
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Parse machine-readable contracts
        run: |
          python -m json.tool spec/phase-15-experiment-protocol-candidate.json >/dev/null
          python -m json.tool spec/phase-15-treatment-comparability-matrix.json >/dev/null
          python -m json.tool spec/phase-15-d3b-capture-integration.json >/dev/null
          python -m json.tool spec/phase-15-d4-freeze-review.json >/dev/null
          python -m json.tool experiments/configs/phase-15-matched-family-population.json >/dev/null
          python -m json.tool experiments/configs/phase-15-family-descriptive-plan.json >/dev/null

      - name: Run comparability, population, capture, plan, and review unit tests
        env:
          PYTHONPATH: src
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_phase15_treatment_comparability.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_phase15_matched_family_population.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_phase15_capture.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_phase15_family_descriptive_plan.py" \
            -v
          python -m unittest discover \
            -s tests \
            -p "test_phase15_d4_freeze_review.py" \
            -v

      - name: Validate treatment comparability
        env:
          PYTHONPATH: src
        run: python experiments/scripts/validate_phase15_treatment_comparability.py

      - name: Validate matched-family population
        env:
          PYTHONPATH: src
        run: python experiments/scripts/validate_phase15_matched_family_population.py

      - name: Validate D3B capture integration
        env:
          PYTHONPATH: src
        run: python experiments/scripts/validate_phase15_d3b_capture_integration.py

      - name: Validate D4 descriptive-analysis plan
        env:
          PYTHONPATH: src
        run: python experiments/scripts/validate_phase15_family_descriptive_plan.py

      - name: Validate D4 freeze review package
        run: python experiments/scripts/validate_phase15_d4_freeze_review.py

      - name: Run matched-family population smoke
        env:
          PYTHONPATH: src
        run: |
          output_dir="$(mktemp -d)"
          python experiments/scripts/run_phase15_matched_family_population.py \
            --output-dir "$output_dir"
          python - "$output_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          payload = json.loads(
              (root / "phase-15-matched-family-population.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["family_count"] == 4
          assert payload["member_row_count"] == 13
          assert payload["analysis_unit_count"] == 12
          assert payload["publication_evidence"] is False
          assert (
              payload["comparison_authorization"]
              ["pooled_cross_treatment_aggregation"]
              == "NOT_PERMITTED"
          )
          print("wp15_d3_smoke=PASS")
          PY
          (
            cd "$output_dir"
            sha256sum -c phase-15-matched-family-derived.sha256
          )

      - name: Run D4 outcome-blind plan smoke
        env:
          PYTHONPATH: src
        run: |
          output_dir="$(mktemp -d)"
          python experiments/scripts/run_phase15_family_descriptive_plan.py \
            --output-dir "$output_dir"
          test -s "$output_dir/phase-15-family-descriptive-plan-candidate.json"
          test -s "$output_dir/phase-15-family-member-registry.csv"
          test -s "$output_dir/phase-15-family-analysis-units.csv"
          test -s "$output_dir/phase-15-family-observation-plans.csv"
          test -s "$output_dir/phase-15-family-descriptive-plan.sha256"
          python - "$output_dir" <<'PY'
          import csv
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          payload = json.loads(
              (root / "phase-15-family-descriptive-plan-candidate.json").read_text(
                  encoding="utf-8"
              )
          )
          assert payload["family_count"] == 4
          assert payload["member_row_count"] == 13
          assert payload["analysis_unit_count"] == 12
          assert payload["observation_cutoff_count"] == 4
          assert payload["denominator_candidate_count"] == 4
          assert payload["publication_evidence"] is False
          assert payload["outcome_blindness"] == {
              "outcome_dependent_branching": False,
              "projected_metric_values_read": False,
              "raw_execution_values_read": False,
          }
          assert (
              payload["claim_boundary"]
              ["family_specific_descriptive_comparison"]
              == "NOT_YET_AUTHORIZED"
          )
          assert (
              payload["claim_boundary"]["success_rate_or_percentage"]
              == "NOT_PERMITTED"
          )
          with (root / "phase-15-family-member-registry.csv").open(
              "r", encoding="utf-8", newline=""
          ) as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 13
          assert "outcome" not in rows[0]
          assert "projected_metrics_json" not in rows[0]
          print("wp15_d4_smoke=PASS")
          PY
          (
            cd "$output_dir"
            sha256sum -c phase-15-family-descriptive-plan.sha256
          )

      - name: Run integrated D3B capture smoke
        env:
          PYTHONPATH: src
        run: |
          output_root="$(mktemp -d)"
          python experiments/scripts/run_phase15_pilot_capture.py \
            --output-root "$output_root" \
            --run-id phase15-d3b-ci-smoke
          run_dir="$output_root/phase15-d3b-ci-smoke"
          test -s "$run_dir/config/phase-15-treatment-comparability-matrix.json"
          test -s "$run_dir/config/phase-15-matched-family-population.json"
          test -s "$run_dir/config/t1-provisional-test-catalog.json"
          test -s "$run_dir/derived/phase-15-matched-family-population.json"
          test -s "$run_dir/derived/phase-15-matched-family-members.csv"
          test -s "$run_dir/derived/phase-15-matched-family-denominators.csv"
          test -s "$run_dir/derived/phase-15-matched-family-derived.sha256"
          test -s "$run_dir/manifests/derived.sha256"
          python - "$run_dir" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          metadata = json.loads(
              (root / "governance/run-metadata.json").read_text(
                  encoding="utf-8"
              )
          )
          payload = json.loads(
              (
                  root
                  / "derived/phase-15-matched-family-population.json"
              ).read_text(encoding="utf-8")
          )
          assert metadata["schema_version"] == "0.2.0"
          assert metadata["git_status"] == "CLEAN"
          assert metadata["runner_exit_code"] == 0
          assert metadata["baseline_exit_code"] == 0
          assert metadata["matched_family_process_exit_code"] == 0
          assert metadata["matched_family_exit_code"] == 0
          assert metadata["matched_family_status"] == "COMPLETED_AND_VERIFIED"
          assert metadata["analysis_exit_code"] == 0
          assert metadata["overall_exit_code"] == 0
          assert metadata["matched_family_population_counts"] == {
              "family_count": 4,
              "member_row_count": 13,
              "analysis_unit_count": 12,
          }
          assert len(metadata["comparability_matrix_sha256"]) == 64
          assert len(metadata["matched_family_config_sha256"]) == 64
          assert len(metadata["t1_catalog_sha256"]) == 64
          assert payload["publication_evidence"] is False
          assert (
              metadata["claim_boundary"]
              ["family_specific_descriptive_comparison"]
              == "NOT_YET_AUTHORIZED"
          )
          assert (
              metadata["claim_boundary"]
              ["pooled_cross_treatment_aggregation"]
              == "NOT_PERMITTED"
          )
          print("wp15_d3b_ci_smoke=PASS")
          PY
          (
            cd "$run_dir/derived"
            sha256sum -c phase-15-matched-family-derived.sha256
          )
          (
            cd "$run_dir"
            sha256sum -c manifests/raw.sha256
            sha256sum -c manifests/derived.sha256
            sha256sum -c manifests/analysis.sha256
            sha256sum -c manifests/run-bundle.sha256
          )

      - name: Validate Phase 15 protocol
        run: python experiments/scripts/validate_phase15_protocol.py

      - name: Validate tracked-file manifest
        run: python experiments/scripts/validate_repository_manifest.py
